<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout(
      ~{'Thông báo'},
      ~{::content})}">

<th:block th:fragment="content">

    <div class="container py-4">

        <!-- Tiêu đề -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold">
                    <i class="fa-solid fa-bell text-primary me-2"></i>
                    Thông báo
                </h2>

                <p class="text-muted mb-0">
                    Danh sách thông báo của bạn
                </p>

            </div>

        </div>

        <!-- Card -->
        <div class="card shadow-sm border-0 rounded-4">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-primary">

                        <tr>

                            <th width="8%">STT</th>

                            <th width="20%">Tiêu đề</th>

                            <th>Nội dung</th>

                            <th width="18%">Thời gian</th>

                            <th width="12%">Trạng thái</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:if="${#lists.isEmpty(notifications)}">

                            <td colspan="5" class="text-center text-muted py-4">

                                <i class="fa-solid fa-inbox fa-2x mb-2"></i>

                                <br>

                                Chưa có thông báo nào.

                            </td>

                        </tr>

                        <tr th:each="notification, stat : ${notifications}">

                            <td th:text="${stat.index + 1}"></td>

                            <td class="fw-semibold"
                                th:text="${notification.title}">
                            </td>

                            <td th:text="${notification.content}">
                            </td>

                            <td th:text="${#temporals.format(notification.createdAt,
                                   'dd/MM/yyyy HH:mm')}">
                            </td>

                            <td>

                                <span
                                        th:if="${notification.isRead}"
                                        class="badge bg-success">

                                    Đã đọc

                                </span>

                                <span
                                        th:unless="${notification.isRead}"
                                        class="badge bg-warning text-dark">

                                    Chưa đọc

                                </span>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</th:block>

</html>
