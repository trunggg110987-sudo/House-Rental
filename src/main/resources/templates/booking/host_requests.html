<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout('Quản lý phê duyệt đặt nhà', ~{::div.main-content})}">
<body>

<div class="main-content container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0 text-primary">
            <i class="fa-solid fa-user-shield me-2"></i> Duyệt Yêu Cầu Thuê Nhà (Chủ Nhà)
        </h3>
        <span class="badge bg-secondary rounded-pill px-3 py-2">Host Dashboard</span>
    </div>

    <div th:if="${#lists.isEmpty(bookings)}" class="text-center py-5 bg-white rounded-4 shadow-sm">
        <i class="fa-solid fa-inbox fs-1 text-muted mb-3"></i>
        <h5 class="fw-bold text-secondary">Chưa có yêu cầu đặt nhà nào cần phê duyệt</h5>
    </div>

    <div th:if="${not #lists.isEmpty(bookings)}" class="card border-0 rounded-4 shadow-sm overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-4">Nhà Cho Thuê</th>
                        <th>Người Yêu Cầu Thuê</th>
                        <th>Thời Gian Thuê</th>
                        <th>Tổng Giá Tiền</th>
                        <th>Trạng Thái</th>
                        <th class="text-center">Thao Tác Duyệt</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="b : ${bookings}">
                        <td class="ps-4">
                            <div class="d-flex align-items-center gap-3">
                                <img th:src="${b.house.thumbnailUrl}" class="rounded-3" style="width: 70px; height: 50px; object-fit: cover;">
                                <div>
                                    <div class="fw-bold text-dark" th:text="${b.house.name}"></div>
                                    <div class="text-muted small" th:text="${b.house.address}"></div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="fw-bold" th:text="${b.renter != null ? b.renter.fullName : 'Khách hàng'}"></div>
                            <div class="text-muted small"><i class="fa-solid fa-phone me-1"></i> <span th:text="${b.renter != null ? b.renter.phone : ''}"></span></div>
                        </td>
                        <td class="small">
                            <div>Từ: <strong th:text="${b.startDate}"></strong></div>
                            <div>Đến: <strong th:text="${b.endDate}"></strong></div>
                        </td>
                        <td class="fw-bold text-primary" th:text="${#numbers.formatDecimal(b.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>
                        <td>
                            <span class="badge px-3 py-2 rounded-pill"
                                  th:classappend="${b.status.name() == 'APPROVED' ? 'bg-success' : (b.status.name() == 'PENDING' ? 'bg-warning text-dark' : 'bg-danger')}"
                                  th:text="${b.status}">
                            </span>
                        </td>
                        <td class="text-center">
                            <div th:if="${b.status.name() == 'PENDING'}" class="d-flex justify-content-center gap-2">
                                <form th:action="@{'/bookings/' + ${b.id} + '/approve'}" method="post">
                                    <button type="submit" class="btn btn-success btn-sm rounded-pill px-3 fw-bold">
                                        <i class="fa-solid fa-check me-1"></i> Phê Duyệt
                                    </button>
                                </form>
                                <form th:action="@{'/bookings/' + ${b.id} + '/reject'}" method="post">
                                    <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-bold">
                                        <i class="fa-solid fa-xmark me-1"></i> Từ Chối
                                    </button>
                                </form>
                            </div>
                            <div th:if="${b.status.name() != 'PENDING'}" class="text-muted small fst-italic">
                                Đã xử lý
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
