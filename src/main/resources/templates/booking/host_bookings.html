<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout('Lịch đặt thuê', ~{::div.main-content})}">

<body>

<div class="main-content container py-4">

    <!-- FORM TÌM KIẾM -->
    <div class="card shadow-sm border-0 rounded-4 mb-4">

        <div class="card-body p-4">

            <form method="get"
                  th:action="@{/bookings/host-bookings}">

                <div class="row g-3">

                    <div class="col-md-3">

                        <label class="form-label fw-semibold">

                            <i class="fa-solid fa-house me-1"></i>

                            Tên nhà

                        </label>

                        <input type="text"
                               name="houseName"
                               class="form-control"
                               placeholder="Nhập tên nhà..."
                               th:value="${houseName}">

                    </div>


                    <div class="col-md-2">

                        <label class="form-label fw-semibold">

                            Từ ngày

                        </label>

                        <input type="date"
                               name="startDate"
                               class="form-control"
                               th:value="${startDate}">

                    </div>


                    <div class="col-md-2">

                        <label class="form-label fw-semibold">

                            Đến ngày

                        </label>

                        <input type="date"
                               name="endDate"
                               class="form-control"
                               th:value="${endDate}">

                    </div>


                    <div class="col-md-3">

                        <label class="form-label fw-semibold">

                            Trạng thái đơn

                        </label>

                        <select name="status"
                                class="form-select">

                            <option value="">

                                Tất cả

                            </option>


                            <option value="APPROVED"
                                    th:selected="${status != null and status.name() == 'APPROVED'}">

                                Chờ nhận phòng

                            </option>


                            <option value="CHECKED_IN"
                                    th:selected="${status != null and status.name() == 'CHECKED_IN'}">

                                Đang ở

                            </option>


                            <option value="CHECKED_OUT"
                                    th:selected="${status != null and status.name() == 'CHECKED_OUT'}">

                                Đã trả phòng

                            </option>


                            <option value="CANCELLED"
                                    th:selected="${status != null and status.name() == 'CANCELLED'}">

                                Đã hủy

                            </option>

                        </select>

                    </div>


                    <div class="col-md-2 d-flex align-items-end">

                        <button type="submit"
                                class="btn btn-primary w-100">

                            <i class="fa-solid fa-magnifying-glass me-1"></i>

                            Tìm kiếm

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>


    <!-- TIÊU ĐỀ -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">

                <i class="fa-solid fa-calendar-days text-primary me-2"></i>

                Lịch đặt thuê

            </h2>

            <p class="text-muted mb-0">

                Quản lý các đơn thuê nhà của bạn

            </p>

        </div>

        <a th:href="@{/houses/my-houses}"
           class="btn btn-outline-secondary">

            <i class="fa-solid fa-house me-1"></i>

            Quản lý nhà

        </a>

    </div>


    <!-- BẢNG -->

    <div class="card shadow-sm border-0 rounded-4">

        <div class="card-body p-4">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">

                    <tr>

                        <th>Thời gian thuê</th>

                        <th>Tên ngôi nhà</th>

                        <th>Khách hàng</th>

                        <th>Tổng đơn</th>

                        <th>Trạng thái</th>

                        <th class="text-center">

                            Hành động

                        </th>

                    </tr>

                    </thead>


                    <tbody>

                    <tr th:each="booking : ${bookingPage.content}">

                        <td>

                            <div>

                                <i class="fa-solid fa-calendar text-primary me-1"></i>

                                <span th:text="${booking.startDate}"></span>

                            </div>

                            <div>

                                <i class="fa-solid fa-calendar-check text-danger me-1"></i>

                                <span th:text="${booking.endDate}"></span>

                            </div>

                        </td>


                        <td>

                            <a th:href="@{/houses/{id}(id=${booking.house.id})}"
                               class="text-decoration-none fw-semibold">

                                <i class="fa-solid fa-house me-1"></i>

                                <span th:text="${booking.house.name}"></span>

                            </a>

                        </td>


                        <td>

                            <i class="fa-solid fa-user me-1"></i>

                            <span th:text="${booking.renter.fullName}"></span>

                        </td>


                        <td class="fw-bold text-success">

                            <span th:text="${#numbers.formatDecimal(
                                booking.totalPrice,
                                0,
                                'COMMA',
                                0,
                                'POINT')}">

                            </span>

                            VNĐ

                        </td>


                        <td>

                            <span class="badge bg-secondary"
                                  th:if="${booking.status.name() == 'PENDING'}">

                                Chờ duyệt

                            </span>


                            <span class="badge bg-warning text-dark"
                                  th:if="${booking.status.name() == 'APPROVED'}">

                                Chờ nhận phòng

                            </span>


                            <span class="badge bg-primary"
                                  th:if="${booking.status.name() == 'CHECKED_IN'}">

                                Đang ở

                            </span>


                            <span class="badge bg-success"
                                  th:if="${booking.status.name() == 'CHECKED_OUT'}">

                                Đã trả phòng

                            </span>


                            <span class="badge bg-danger"
                                  th:if="${booking.status.name() == 'CANCELLED'}">

                                Đã hủy

                            </span>


                            <span class="badge bg-danger"
                                  th:if="${booking.status.name() == 'REJECTED'}">

                                Đã từ chối

                            </span>

                        </td>


                        <td class="text-center">

                            <form th:if="${booking.status.name() == 'APPROVED'}"
                                  th:action="@{/bookings/{id}/checkin(id=${booking.id})}"
                                  method="post"
                                  style="display:inline">

                                <button type="submit"
                                        class="btn btn-primary btn-sm">

                                    Checkin

                                </button>

                            </form>


                            <form th:if="${booking.status.name() == 'CHECKED_IN'}"
                                  th:action="@{/bookings/{id}/checkout(id=${booking.id})}"
                                  method="post"
                                  style="display:inline">

                                <button type="submit"
                                        class="btn btn-success btn-sm">

                                    Checkout

                                </button>

                            </form>


                            <span class="text-muted"
                                  th:if="${booking.status.name() != 'APPROVED'
                                  and booking.status.name() != 'CHECKED_IN'}">

                                --

                            </span>

                        </td>

                    </tr>


                    <tr th:if="${bookingPage.empty}">

                        <td colspan="6"
                            class="text-center text-muted py-4">

                            <i class="fa-solid fa-calendar-xmark fa-2x mb-2"></i>

                            <p class="mb-0">

                                Không tìm thấy lịch thuê nào.

                            </p>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- PHÂN TRANG -->

    <nav th:if="${bookingPage.totalPages > 1}"
         class="mt-4">

        <ul class="pagination justify-content-center">

            <li class="page-item"
                th:classappend="${bookingPage.first} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/bookings/host-bookings(
                   page=${bookingPage.number - 1},
                   houseName=${houseName},
                   startDate=${startDate},
                   endDate=${endDate},
                   status=${status})}">

                    Trước

                </a>

            </li>


            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, bookingPage.totalPages - 1)}"
                th:classappend="${i == bookingPage.number} ? 'active'">

                <a class="page-link"
                   th:text="${i + 1}"
                   th:href="@{/bookings/host-bookings(
                   page=${i},
                   houseName=${houseName},
                   startDate=${startDate},
                   endDate=${endDate},
                   status=${status})}">

                </a>

            </li>


            <li class="page-item"
                th:classappend="${bookingPage.last} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/bookings/host-bookings(
                   page=${bookingPage.number + 1},
                   houseName=${houseName},
                   startDate=${startDate},
                   endDate=${endDate},
                   status=${status})}">

                    Sau

                </a>

            </li>

        </ul>

    </nav>

</div>

</body>

</html>
