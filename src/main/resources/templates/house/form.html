<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout('Đăng tin cho thuê nhà mới', ~{::div.main-content})}">
<body>

<div class="main-content container py-4" style="max-width: 800px;">
    <div class="card border-0 rounded-4 shadow-sm p-4 bg-white">
        <h3 class="fw-bold mb-4 text-primary">
            <i class="fa-solid fa-plus-circle me-2"></i> Đăng Tin Cho Thuê Nhà Mới
        </h3>

        <form th:action="@{/houses/create}" method="post" enctype="multipart/form-data" th:object="${house}">

            <div class="mb-3">
                <label class="form-label fw-bold">Tên Nhà / Căn Hộ <span class="text-danger">*</span></label>
                <input type="text" th:field="*{name}" class="form-control"
                       placeholder="VD: Căn hộ chung cư Vinhomes 2 phòng ngủ" required/>
                <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Loại Hình Nhà <span class="text-danger">*</span></label>
                    <select th:field="*{category.id}" class="form-select" required>
                        <option value="">-- Chọn loại nhà --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Giá Cho Thuê (VNĐ / Tháng) <span
                            class="text-danger">*</span></label>
                    <input type="number" step="100000" th:field="*{pricePerMonth}" class="form-control"
                           placeholder="VD: 12000000" required/>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Địa Chỉ Chi Tiết <span class="text-danger">*</span></label>
                <input type="text" th:field="*{address}" class="form-control"
                       placeholder="Số nhà, đường, quận/huyện, tỉnh/thành phố" required/>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Số Phòng Ngủ</label>
                    <input type="number" th:field="*{numberOfBedrooms}" class="form-control" min="1" value="1"
                           required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Số Phòng Tắm / WC</label>
                    <input type="number" th:field="*{numberOfBathrooms}" class="form-control" min="1" value="1"
                           required/>
                </div>
            </div>

            <!-- Image Thumbnail & Multiple File Upload -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Ảnh Đại Diện (Thumbnail) <i class="fa-solid fa-image text-primary me-1"></i></label>
                    <input type="file" name="imageFile" class="form-control" accept="image/*"/>
                    <div class="form-text">Ảnh đại diện chính của căn nhà.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Đăng Nhiều Ảnh Chi Tiết <i class="fa-solid fa-images text-success me-1"></i></label>
                    <input type="file" name="imageFiles" class="form-control" accept="image/*" multiple/>
                    <div class="form-text">Bạn có thể chọn nhiều ảnh cùng lúc để đăng lên album nhà.</div>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Mô Tả Tiện Ích & Thông Tin</label>
                <textarea th:field="*{description}" class="form-control" rows="5"
                          placeholder="Mô tả thông tin chi tiết về nội thất, diện tích, quy định cho thuê..."></textarea>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/}" class="btn btn-light border rounded-pill px-4">Hủy Bỏ</a>
                <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">
                    <i class="fa-solid fa-check me-1"></i> Đăng Tin Ngay
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
