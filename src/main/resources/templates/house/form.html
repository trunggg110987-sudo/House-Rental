<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout(${house.id} == null ? 'Đăng tin cho thuê nhà mới' : 'Cập nhật thông tin nhà', ~{::div.main-content})}">
<body>

<div class="main-content container py-4" style="max-width: 800px;">
    <div class="card border-0 rounded-4 shadow-sm p-4 bg-white">
        <h3 class="fw-bold mb-4 text-primary">
            <i class="fa-solid fa-plus-circle me-2" th:if="${house.id} == null"></i>
            <i class="fa-solid fa-pen-to-square me-2" th:if="${house.id} != null"></i>
            <span th:text="${house.id} == null ? 'Đăng Tin Cho Thuê Nhà Mới' : 'Cập Nhật Thông Tin Nhà'"></span>
        </h3>

        <form th:action="${house.id} == null ? @{/houses/create} : @{'/houses/' + ${house.id} + '/edit'}"
              method="post" enctype="multipart/form-data" th:object="${house}">

            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label class="form-label fw-bold">Tên Nhà / Căn Hộ <span class="text-danger">*</span></label>
                <input type="text" th:field="*{name}" class="form-control" placeholder="VD: Căn hộ chung cư Vinhomes 2 phòng ngủ" required />
                <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Loại Hình Nhà <span class="text-danger">*</span></label>
                    <select th:field="*{category.id}" class="form-select" required>
                        <option value="">-- Chọn loại nhà --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Giá Cho Thuê (VNĐ / Ngày) <span class="text-danger">*</span></label>
                    <input type="number" step="10000" th:field="*{pricePerMonth}" class="form-control" placeholder="VD: 500000" required />
                    <div class="text-danger small" th:if="${#fields.hasErrors('pricePerMonth')}" th:errors="*{pricePerMonth}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Địa Chỉ Chi Tiết <span class="text-danger">*</span></label>
                <input type="text" th:field="*{address}" class="form-control" placeholder="Số nhà, đường, quận/huyện, tỉnh/thành phố" required />
                <div class="text-danger small" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Số Phòng Ngủ (1-10) <span class="text-danger">*</span></label>
                    <input type="number" th:field="*{numberOfBedrooms}" class="form-control" min="1" max="10" required />
                    <div class="text-danger small" th:if="${#fields.hasErrors('numberOfBedrooms')}" th:errors="*{numberOfBedrooms}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Số Phòng Tắm / WC (1-3) <span class="text-danger">*</span></label>
                    <input type="number" th:field="*{numberOfBathrooms}" class="form-control" min="1" max="3" required />
                    <div class="text-danger small" th:if="${#fields.hasErrors('numberOfBathrooms')}" th:errors="*{numberOfBathrooms}"></div>
                </div>
            </div>

            <!-- Ảnh hiện tại (chỉ hiện khi Edit) -->
            <div class="mb-3" th:if="${house.id} != null and ${house.thumbnailUrl} != null">
                <label class="form-label fw-bold">Ảnh Hiện Tại</label>
                <div>
                    <img th:src="${house.thumbnailUrl}" style="max-height:150px;" class="rounded-3 border" alt="Ảnh hiện tại" />
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">
                    <span th:text="${house.id} == null ? 'Tải Ảnh Thumbnail' : 'Đổi Ảnh Khác (bỏ trống nếu giữ ảnh cũ)'"></span>
                    <i class="fa-solid fa-image text-primary me-1"></i>
                </label>
                <input type="file" name="imageFile" class="form-control" accept="image/jpeg,image/png" />
                <div class="form-text">Chỉ chấp nhận định dạng JPG, PNG. Nếu không chọn, hệ thống dùng ảnh mặc định / giữ ảnh cũ.</div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Mô Tả Tiện Ích & Thông Tin</label>
                <textarea th:field="*{description}" class="form-control" rows="5" placeholder="Mô tả thông tin chi tiết về nội thất, diện tích, quy định cho thuê..."></textarea>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/houses/my-houses}" class="btn btn-light border rounded-pill px-4">Hủy Bỏ</a>
                <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">
                    <i class="fa-solid fa-check me-1"></i>
                    <span th:text="${house.id} == null ? 'Đăng Tin Ngay' : 'Lưu Thay Đổi'"></span>
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
