<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout('Đăng tin cho thuê nhà mới', ~{::div.main-content})}">
<body>

<div class="main-content container py-4" style="max-width: 800px;">
    <div class="card border-0 rounded-4 shadow-sm p-4 bg-white">
        <h3 class="fw-bold mb-4 text-primary">
            <i class="fa-solid me-2" th:classappend="${house.id == null ? 'fa-plus-circle' : 'fa-pen-to-square'}"></i>
            <span th:text="${house.id == null ? 'Đăng Tin Cho Thuê Nhà Mới' : 'Chỉnh Sửa Thông Tin Nhà'}">Đăng Tin Cho Thuê Nhà Mới</span>
        </h3>

        <form id="houseEditForm"
              th:action="${house.id == null} ? @{/houses/create} : @{/houses/{id}/edit(id=${house.id})}"
              method="post"
              enctype="multipart/form-data"
              th:object="${house}">

            <div class="mb-3">
                <label class="form-label fw-bold">Tên Nhà / Căn Hộ <span class="text-danger">*</span></label>
                <input type="text" th:field="*{name}" class="form-control"
                       placeholder="VD: Căn hộ chung cư Vinhomes 2 phòng ngủ" required/>
                <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Loại Hình Nhà <span class="text-danger">*</span></label>
                    <select th:field="*{category.id}" class="form-select" required>
                        <option value="">-- Chọn loại nhà --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Giá Cho Thuê (VNĐ / Ngày) <span
                            class="text-danger">*</span></label>
                    <input type="number" step="50000" th:field="*{pricePerDay}" class="form-control"
                           placeholder="VD: 850000" required/>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Địa Chỉ Chi Tiết <span class="text-danger">*</span></label>
                <input type="text" th:field="*{address}" class="form-control"
                       placeholder="Số nhà, đường, quận/huyện, tỉnh/thành phố" required/>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Số Phòng Ngủ</label>
                    <input type="number" th:field="*{numberOfBedrooms}" class="form-control" min="1" value="1"
                           required/>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Số Phòng Tắm / WC</label>
                    <input type="number" th:field="*{numberOfBathrooms}" class="form-control" min="1" value="1"
                           required/>
                </div>
            </div>

            <!-- IMAGE MANAGEMENT -->
            <div class="mb-4">

                <div class="row g-4">

                    <!-- THUMBNAIL -->
                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            <i class="fa-solid fa-image text-primary me-1"></i>
                            Ảnh Đại Diện (Thumbnail)
                        </label>

                        <div th:if="${house.id != null
                         and house.thumbnailUrl != null
                         and !#strings.isEmpty(house.thumbnailUrl)}"
                             class="mb-3">

                            <p class="text-muted small mb-2">
                                Thumbnail hiện tại:
                            </p>

                            <div class="border rounded-3 overflow-hidden bg-light">

                                <img th:src="${house.thumbnailUrl}"
                                     class="w-100"
                                     style="height: 200px; object-fit: cover;"
                                     alt="Thumbnail hiện tại"
                                     onerror="this.onerror=null; this.src='/images/house-placeholder.svg';">

                            </div>

                        </div>

                        <input type="file"
                               name="imageFile"
                               class="form-control"
                               accept="image/*">

                        <div class="form-text">
                            Chọn ảnh mới để thay thế thumbnail hiện tại.
                            Nếu không chọn, thumbnail cũ được giữ nguyên.
                        </div>

                    </div>


                    <!-- ẢNH CHI TIẾT -->
                    <div class="col-md-6">

                        <label class="form-label fw-bold">
                            <i class="fa-solid fa-images text-success me-1"></i>
                            Thêm Ảnh Chi Tiết
                        </label>

                        <input type="file"
                               name="imageFiles"
                               class="form-control"
                               accept="image/*"
                               multiple>

                        <div class="form-text">
                            Có thể chọn nhiều ảnh.
                            Ảnh mới sẽ được thêm vào album hiện tại.
                        </div>

                    </div>

                </div>


                <!-- ALBUM -->
                <div th:if="${house.id != null
                 and house.images != null
                 and !#lists.isEmpty(house.images)}"
                     class="mt-4">

                    <div class="d-flex align-items-center justify-content-between mb-3">

                        <h6 class="fw-bold mb-0">
                            <i class="fa-solid fa-photo-film text-success me-1"></i>
                            Ảnh Chi Tiết Hiện Tại
                        </h6>

                        <span class="badge bg-light text-dark border"
                              th:text="${#lists.size(house.images) + ' ảnh'}">
                0 ảnh
            </span>

                    </div>

                    <div class="row g-3">

                        <div class="col-6 col-md-4 col-lg-3"
                             th:each="image : ${house.images}">

                            <div class="card border-0 shadow-sm rounded-3 overflow-hidden h-100">

                                <img th:src="${image.imageUrl}"
                                     class="w-100"
                                     style="height: 150px; object-fit: cover;"
                                     alt="Ảnh chi tiết"
                                     onerror="this.onerror=null; this.src='/images/house-placeholder.svg';">

                                <div class="p-2">

                                    <button type="button"
                                            class="btn btn-sm btn-outline-danger w-100"
                                            th:attr="data-house-id=${house.id},
                                         data-image-id=${image.id}"
                                            onclick="deleteHouseImage(this)">

                                        <i class="fa-solid fa-trash me-1"></i>
                                        Xóa ảnh

                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Mô Tả Tiện Ích & Thông Tin (WYSIWYG)</label>
                <textarea th:field="*{description}" class="form-control wysiwyg-editor" rows="6"
                          placeholder="Mô tả thông tin chi tiết về nội thất, diện tích, quy định cho thuê..."></textarea>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/}" class="btn btn-light border rounded-pill px-4">Hủy Bỏ</a>
                <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">
                    <i class="fa-solid fa-check me-1"></i>
                    <span th:text="${house.id == null ? 'Đăng Tin Ngay' : 'Lưu Thay Đổi'}">
                        Đăng Tin Ngay
                    </span>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    function deleteHouseImage(button) {

        const houseId = button.getAttribute('data-house-id');
        const imageId = button.getAttribute('data-image-id');

        if (!confirm('Bạn có chắc muốn xóa ảnh này không?')) {
            return;
        }

        const formData = new FormData();

        fetch(`/houses/${houseId}/images/${imageId}/delete`, {
            method: 'POST',
            body: formData
        })
        .then(response => {

            if (response.ok || response.redirected) {
                window.location.reload();
            } else {
                alert('Không thể xóa ảnh. Vui lòng thử lại.');
            }

        })
        .catch(error => {

            console.error('Delete image error:', error);

            alert('Có lỗi xảy ra khi xóa ảnh.');

        });
    }
</script>
</body>
</html>
