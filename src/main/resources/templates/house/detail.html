<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout('Chi tiết nhà cho thuê', ~{::div.main-content})}">
<body>

<div class="main-content container py-4">
    <!-- Navigation back -->
    <a th:href="@{/}" class="btn btn-light rounded-pill px-3 mb-4 border">
        <i class="fa-solid fa-arrow-left me-1"></i> Quay lại danh sách
    </a>

    <div class="row g-4">
        <!-- Left Side: Large Thumbnail & Main Details -->
        <div class="col-lg-8">
            <div class="card border-0 rounded-4 shadow-sm overflow-hidden mb-4">
                <img th:src="${house.thumbnailUrl}" class="w-100" style="max-height: 480px; object-fit: cover;"
                     alt="Thumbnail house detail">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h2 class="fw-bold text-dark mb-0" th:text="${house.name}">Tên nhà cho thuê</h2>
                        <span class="badge fs-6 px-3 py-2 rounded-pill"
                              th:classappend="'badge-status-' + ${house.status}"
                              th:text="${house.status}">AVAILABLE</span>
                    </div>

                    <p class="text-muted fs-6 mb-3">
                        <i class="fa-solid fa-location-dot text-danger me-1"></i> <span th:text="${house.address}">Địa chỉ</span>
                    </p>

                    <hr class="my-4">

                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-circle-info text-primary me-2"></i> Thông Tin Đặc
                        Điểm</h5>
                    <div class="row g-3 text-center mb-4">
                        <div class="col-4">
                            <div class="p-3 bg-light rounded-3 border">
                                <i class="fa-solid fa-bed fs-3 text-primary mb-1"></i>
                                <div class="fw-bold fs-5" th:text="${house.numberOfBedrooms}">2</div>
                                <div class="text-muted small">Phòng ngủ</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="p-3 bg-light rounded-3 border">
                                <i class="fa-solid fa-bath fs-3 text-primary mb-1"></i>
                                <div class="fw-bold fs-5" th:text="${house.numberOfBathrooms}">2</div>
                                <div class="text-muted small">Phòng tắm</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="p-3 bg-light rounded-3 border">
                                <i class="fa-solid fa-layer-group fs-3 text-primary mb-1"></i>
                                <div class="fw-bold fs-5"
                                     th:text="${house.category != null ? house.category.name : 'Khác'}">Căn hộ
                                </div>
                                <div class="text-muted small">Loại nhà</div>
                            </div>
                        </div>
                    </div>

                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-align-left text-primary me-2"></i> Mô Tả Chi Tiết
                    </h5>
                    <p class="text-secondary lh-lg" th:text="${house.description}">Nội dung mô tả nhà cho thuê...</p>
                </div>
            </div>
        </div>

        <!-- Right Side: Booking Panel & Price Tag -->
        <div class="col-lg-4">
            <div class="card border-0 rounded-4 shadow-sm p-4 sticky-top" style="top: 90px;">
                <div class="mb-3">
                    <span class="text-muted small">Giá thuê từ:</span>
                    <div class="d-flex align-items-baseline">
                        <h3 class="price-text mb-0 me-2"
                            th:text="${#numbers.formatDecimal(house.pricePerMonth, 0, 'COMMA', 0, 'POINT')}">
                            15,000,000</h3>
                        <span class="text-muted">VNĐ / tháng</span>
                    </div>
                </div>

                <div class="card bg-light border-0 p-3 rounded-3 mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center"
                             style="width: 48px; height: 48px;">
                            <i class="fa-solid fa-user-tie fs-4"></i>
                        </div>
                        <div>
                            <div class="fw-bold" th:text="${house.host != null ? house.host.fullName : 'Chủ nhà'}">
                                Nguyễn Văn Nam
                            </div>
                            <div class="text-muted small"><i class="fa-solid fa-phone me-1"></i> <span
                                    th:text="${house.host != null ? house.host.phone : '0905123456'}"></span></div>
                        </div>
                    </div>
                </div>

                <!-- Booking Form -->
                <form th:action="@{/bookings/create}" method="post" th:object="${booking}">
                    <input type="hidden" name="houseId" th:value="${house.id}"/>

                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold small text-secondary">Ngày bắt đầu thuê</label>
                        <input type="date" name="startDate" class="form-control" required/>
                    </div>

                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold small text-secondary">Ngày trả nhà</label>
                        <input type="date" name="endDate" class="form-control" required/>
                    </div>

                    <div class="alert alert-warning small border-0 mb-4">
                        <i class="fa-solid fa-clock me-1"></i> Sau khi đặt phòng, Chủ nhà sẽ xem xét và **duyệt yêu
                        cầu** của bạn.
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold fs-6 shadow-sm"
                            th:disabled="${house.status.name() != 'AVAILABLE'}">
                        <i class="fa-solid fa-paper-plane me-2"></i> Gửi Yêu Cầu Thuê Nhà
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
