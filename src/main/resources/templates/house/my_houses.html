<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout('Quản lý nhà cho thuê của tôi', ~{::div.main-content})}">
<body>

<div class="main-content container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0 text-primary">
            <i class="fa-solid fa-house-user me-2"></i> Danh Sách Nhà Cho Thuê Của Tôi
        </h3>
        <a th:href="@{/houses/create}" class="btn btn-primary rounded-pill px-4 fw-bold">
            <i class="fa-solid fa-plus me-1"></i> Đăng Nhà Mới
        </a>
    </div>

    <div th:if="${#lists.isEmpty(houses)}" class="text-center py-5 bg-white rounded-4 shadow-sm">
        <i class="fa-solid fa-house-chimney-window fs-1 text-muted mb-3"></i>
        <h5 class="fw-bold text-secondary">Bạn chưa đăng tin cho thuê nhà nào</h5>
        <a th:href="@{/houses/create}" class="btn btn-primary rounded-pill px-4 mt-2">Tạo Đăng Tin Đầu Tiên</a>
    </div>

    <div th:if="${not #lists.isEmpty(houses)}" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="h : ${houses}">
            <div class="card house-card h-100 shadow-sm">
                <img th:src="${h.thumbnailUrl}" class="house-card-img" alt="House image">
                <div class="card-body">
                    <h5 class="fw-bold text-truncate" th:text="${h.name}"></h5>
                    <p class="text-muted small text-truncate"><i class="fa-solid fa-location-dot me-1"></i> <span
                            th:text="${h.address}"></span></p>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="price-text"
                              th:text="${#numbers.formatDecimal(h.pricePerMonth, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></span>
                        <span class="badge" th:classappend="'badge-status-' + ${h.status}" th:text="${h.status}"></span>
                    </div>

                    <!-- [CẢI TIẾN]: Bổ sung các nút hành động Sửa thông tin và Xóa nhà cho Chủ nhà -->
                    <div class="d-flex gap-2 pt-2 border-top">
                        <a th:href="@{'/houses/' + ${h.id} + '/edit'}" class="btn btn-outline-warning btn-sm flex-fill rounded-pill">
                            <i class="fa-solid fa-pen-to-square me-1"></i> Sửa
                        </a>
                        <form th:action="@{'/houses/' + ${h.id} + '/delete'}" method="post" class="flex-fill"
                              onsubmit="return confirm('Bạn có chắc chắn muốn xóa căn nhà này?');">
                            <button type="submit" class="btn btn-outline-danger btn-sm w-100 rounded-pill">
                                <i class="fa-solid fa-trash me-1"></i> Xóa
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
