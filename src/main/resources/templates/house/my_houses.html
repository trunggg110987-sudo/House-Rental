<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout('Quản lý nhà cho thuê của tôi', ~{::div.main-content})}">
<body>

<div class="main-content container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h3 class="fw-bold mb-0 text-primary">
            <i class="fa-solid fa-house-user me-2"></i> Danh Sách Nhà Cho Thuê Của Tôi
        </h3>
        <a th:href="@{/houses/create}" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">
            <i class="fa-solid fa-plus me-1"></i> Đăng Nhà Mới
        </a>
    </div>

    <!-- [TASK 30]: Bộ Lọc Trạng Thái Danh Sách Nhà Cho Thuê -->
    <div class="mb-4">
        <ul class="nav nav-pills bg-white p-2 rounded-4 shadow-sm">
            <li class="nav-item">
                <a class="nav-link rounded-pill fw-bold"
                   th:classappend="${selectedStatus == null} ? 'active' : ''"
                   th:href="@{/houses/my-houses}">
                    <i class="fa-solid fa-layer-group me-1"></i> Tất Cả
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link rounded-pill fw-bold"
                   th:classappend="${selectedStatus != null and selectedStatus.name() == 'RENTED'} ? 'active' : ''"
                   th:href="@{/houses/my-houses(status='RENTED')}">
                    <i class="fa-solid fa-key me-1"></i> Đang Cho Thuê (RENTED)
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link rounded-pill fw-bold"
                   th:classappend="${selectedStatus != null and selectedStatus.name() == 'AVAILABLE'} ? 'active' : ''"
                   th:href="@{/houses/my-houses(status='AVAILABLE')}">
                    <i class="fa-solid fa-circle-check me-1"></i> Còn Trống (AVAILABLE)
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link rounded-pill fw-bold"
                   th:classappend="${selectedStatus != null and selectedStatus.name() == 'MAINTENANCE'} ? 'active' : ''"
                   th:href="@{/houses/my-houses(status='MAINTENANCE')}">
                    <i class="fa-solid fa-screwdriver-wrench me-1"></i> Đang Bảo Trì (MAINTENANCE)
                </a>
            </li>
        </ul>
    </div>

    <div th:if="${#lists.isEmpty(houses)}" class="text-center py-5 bg-white rounded-4 shadow-sm">
        <i class="fa-solid fa-house-chimney-window fs-1 text-muted mb-3"></i>
        <h5 class="fw-bold text-secondary">Không tìm thấy căn nhà nào phù hợp</h5>
        <a th:href="@{/houses/create}" class="btn btn-primary rounded-pill px-4 mt-2">Tạo Đăng Tin Mới</a>
    </div>

    <div th:if="${not #lists.isEmpty(houses)}" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="h : ${houses}">
            <div class="card house-card h-100 shadow-sm rounded-4 overflow-hidden border-0">
                <img th:src="${h.thumbnailUrl}" class="house-card-img" style="height: 200px; object-fit: cover;" alt="House image">
                <div class="card-body d-flex flex-column p-4">
                    <h5 class="fw-bold text-truncate mb-1" th:text="${h.name}"></h5>
                    <p class="text-muted small text-truncate mb-3"><i class="fa-solid fa-location-dot me-1 text-danger"></i> <span
                            th:text="${h.address}"></span></p>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="price-text fs-5 fw-bold text-primary"
                              th:text="${#numbers.formatDecimal(h.pricePerMonth, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></span>
                        <span class="badge px-3 py-2 rounded-pill fs-6" th:classappend="'badge-status-' + ${h.status}" th:text="${h.status}"></span>
                    </div>

                    <!-- Hành động Chủ nhà (Task 28, 29, 30) -->
                    <div class="mt-auto pt-3 border-top d-flex flex-column gap-2">
                        <div class="d-flex gap-2">
                            <a th:href="@{'/houses/' + ${h.id} + '/edit'}" class="btn btn-outline-warning btn-sm flex-fill rounded-pill fw-bold">
                                <i class="fa-solid fa-pen-to-square me-1"></i> Sửa Tin
                            </a>
                            <button type="button" class="btn btn-outline-info btn-sm flex-fill rounded-pill fw-bold"
                                    data-bs-toggle="modal" th:data-bs-target="'#statusModal-' + ${h.id}">
                                <i class="fa-solid fa-calendar-days me-1"></i> Trạng Thái Theo Giai Đoạn
                            </button>
                        </div>
                        <form th:action="@{'/houses/' + ${h.id} + '/delete'}" method="post"
                              onsubmit="return confirm('Bạn có chắc chắn muốn xóa căn nhà này?');">
                            <button type="submit" class="btn btn-outline-danger btn-sm w-100 rounded-pill">
                                <i class="fa-solid fa-trash me-1"></i> Xóa Căn Nhà
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- [TASK 29]: Modal Cập Nhật Trạng Thái Nhà Theo Giai Đoạn Thời Gian -->
            <div class="modal fade" th:id="'statusModal-' + ${h.id}" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content rounded-4 border-0 shadow">
                        <div class="modal-header border-0 pb-0">
                            <h5 class="modal-header-title fw-bold text-primary mb-0">
                                <i class="fa-solid fa-clock-rotate-left me-2"></i> Cập Nhật Trạng Thái Theo Giai Đoạn
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <form th:action="@{'/houses/' + ${h.id} + '/status-period'}" method="post">
                            <div class="modal-body py-4">
                                <p class="text-muted small mb-3">Căn nhà: <strong th:text="${h.name}"></strong></p>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Trạng Thái Áp Dụng <span class="text-danger">*</span></label>
                                    <select name="status" class="form-select" required>
                                        <option value="AVAILABLE"> AVAILABLE (Còn trống / Cho thuê)</option>
                                        <option value="RENTED"> RENTED (Đã cho thuê)</option>
                                        <option value="MAINTENANCE"> MAINTENANCE (Đang bảo trì)</option>
                                    </select>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Từ Ngày <span class="text-danger">*</span></label>
                                        <input type="date" name="startDate" class="form-control" required/>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Đến Ngày <span class="text-danger">*</span></label>
                                        <input type="date" name="endDate" class="form-control" required/>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer border-0 pt-0">
                                <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Hủy</button>
                                <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">
                                    <i class="fa-solid fa-save me-1"></i> Lưu Trạng Thái
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
