<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout('Đăng nhập hệ thống - HouseRental', ~{::div.main-content})}">
<body>

<div class="main-content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    
                    <!-- Header Banner -->
                    <div class="bg-primary text-white text-center py-4 px-3" style="background: linear-gradient(135deg, #0d6efd 0%, #004085 100%);">
                        <div class="mb-2">
                            <i class="fa-solid fa-house-chimney-user fs-1"></i>
                        </div>
                        <h3 class="fw-bold mb-1">Đăng Nhập</h3>
                        <p class="small text-white-50 mb-0">Chào mừng bạn trở lại với HouseRental</p>
                    </div>

                    <div class="card-body p-4 p-md-5">

                        <!-- Traditional Form Login -->
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold text-secondary">Tên đăng nhập hoặc Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" id="username" name="username" class="form-control border-start-0 bg-light" placeholder="Nhập username/email..." required autofocus>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold text-secondary">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="password" name="password" class="form-control border-start-0 bg-light" placeholder="Nhập mật khẩu..." required>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
                                    <label class="form-check-label small text-muted" for="remember-me">Ghi nhớ đăng nhập</label>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold rounded-3 shadow-sm mb-3">
                                <i class="fa-solid fa-right-to-bracket me-2"></i> Đăng Nhập
                            </button>
                        </form>

                        <!-- Divider -->
                        <div class="position-relative my-4 text-center">
                            <hr class="text-muted opacity-25">
                            <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small fw-semibold">HOẶC DÙNG</span>
                        </div>

                        <!-- Social Login Buttons -->
                        <div class="d-grid gap-2">
                            <!-- Google Login Button -->
                            <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-secondary py-2.5 rounded-3 d-flex align-items-center justify-content-center gap-2 fw-semibold bg-white shadow-sm hover-shadow text-dark border">
                                <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                                    <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                                    <path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                                    <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                                    <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
                                </svg>
                                Đăng nhập bằng Google
                            </a>

                            <!-- Facebook Login Button -->
                            <a th:href="@{/oauth2/authorization/facebook}" class="btn py-2.5 rounded-3 d-flex align-items-center justify-content-center gap-2 fw-semibold text-white shadow-sm" style="background-color: #1877F2; border: none;">
                                <i class="fa-brands fa-facebook fs-5"></i>
                                Đăng nhập bằng Facebook
                            </a>
                        </div>

                        <!-- Info note -->
                        <div class="mt-4 p-3 bg-light rounded-3 text-muted small text-center">
                            <i class="fa-solid fa-shield-halved me-1 text-primary"></i> 
                            Hệ thống tự động liên kết hoặc tạo tài khoản mới an toàn khi bạn đăng nhập qua Google hoặc Facebook.
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
