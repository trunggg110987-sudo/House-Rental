<!DOCTYPE html>
<!-- [BỔ SUNG THEO YÊU CẦU TASK 3, 9 & 10]: Trang Profile cá nhân hiển thị Avatar, Địa chỉ, SĐT và Badge nhãn Chủ nhà -->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout('Thông tin cá nhân', ~{:: #profileContent})}">
<body>

<div id="profileContent" class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    
                    <!-- [BỔ SUNG THEO YÊU CẦU TASK 9 & 10]: Khung hiển thị tư cách tài khoản CHỦ NHÀ rõ ràng -->
                    <div class="text-center mb-4">
                        <div class="position-relative d-inline-block mb-3">
                            <img th:src="${user.avatarUrl != null ? user.avatarUrl : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" 
                                 class="rounded-circle shadow-sm border border-3 border-primary" 
                                 style="width: 90px; height: 90px; object-fit: cover;">
                        </div>
                        <h4 class="fw-bold mb-1" th:text="${user.fullName}">Tên Người Dùng</h4>
                        
                        <!-- [BỔ SUNG THEO YÊU CẦU TASK 9 & 10]: Mục nhãn ghi nhận tư cách Chủ nhà -->
                        <div class="mt-2" th:if="${user != null and (user.role.name() == 'ROLE_HOST' or (user.hostStatus != null and user.hostStatus.name() == 'APPROVED'))}">
                            <span class="badge bg-success fs-6 px-3 py-2 rounded-pill">
                                <i class="fa-solid fa-house-user me-1"></i> TÀI KHOẢN CHỦ NHÀ
                            </span>
                        </div>
                        <div class="mt-2" th:if="${user != null and user.role.name() == 'ROLE_USER' and (user.hostStatus == null or user.hostStatus.name() == 'NONE')}">
                            <span class="badge bg-secondary fs-6 px-3 py-2 rounded-pill">
                                <i class="fa-solid fa-user me-1"></i> TÀI KHOẢN KHÁCH THUÊ
                            </span>
                        </div>
                    </div>
                    <hr class="my-4">

                    <!-- Thông báo trạng thái duyệt chủ nhà -->
                    <div class="mt-3" th:if="${user != null and (user.hostStatus == null or user.hostStatus.name() == 'NONE' or user.hostStatus.name() == 'REJECTED')}">
                        <form th:action="@{/profile/request-host}" method="post">
                            <button type="submit" class="btn btn-outline-primary w-100 rounded-pill fw-semibold">
                                <i class="fa-solid fa-house me-1"></i> Đăng Ký Làm Chủ Nhà
                            </button>
                        </form>
                    </div>

                    <div class="alert alert-warning mt-3" th:if="${user != null and user.hostStatus != null and user.hostStatus.name() == 'PENDING'}">
                        <i class="fa-solid fa-clock me-2"></i> Yêu cầu đăng ký chủ nhà đang chờ Quản trị viên duyệt.
                    </div>

                    <form th:action="@{/profile}" th:object="${userProfile}" method="post" class="mt-4" novalidate>
                        <!-- [BỔ SUNG THEO YÊU CẦU TASK 3]: Ô nhập đường dẫn Avatar -->
                        <div class="mb-3">
                            <label for="avatarUrl" class="form-label fw-semibold">Ảnh đại diện (URL Avatar)</label>
                            <input type="text" id="avatarUrl" th:field="*{avatarUrl}"
                                   class="form-control rounded-3" placeholder="Nhập liên kết hình ảnh avatar...">
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Tên đăng nhập (*)</label>
                            <input type="text" id="username" th:field="*{username}" class="form-control bg-light rounded-3" readonly>
                            <small class="text-muted">Tên đăng nhập cố định không thể chỉnh sửa.</small>
                        </div>

                        <!-- [BỔ SUNG THEO YÊU CẦU TASK 3]: Họ tên validate không ký tự đặc biệt -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                            <input type="text" id="fullName" th:field="*{fullName}"
                                   class="form-control rounded-3"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                   placeholder="Nhập họ và tên...">
                            <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                            <input type="email" id="email" th:field="*{email}"
                                   class="form-control rounded-3"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   placeholder="example@gmail.com">
                            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="invalid-feedback"></div>
                        </div>

                        <!-- [BỔ SUNG THEO YÊU CẦU TASK 3]: Ô nhập Địa chỉ cá nhân -->
                        <div class="mb-3">
                            <label for="address" class="form-label fw-semibold">Địa chỉ liên hệ</label>
                            <input type="text" id="address" th:field="*{address}"
                                   class="form-control rounded-3" placeholder="Nhập địa chỉ của bạn...">
                        </div>

                        <!-- [BỔ SUNG THEO YÊU CẦU TASK 3]: Số điện thoại validate -->
                        <div class="mb-4">
                            <label for="phone" class="form-label fw-semibold">Số điện thoại (*)</label>
                            <input type="text" id="phone" th:field="*{phone}"
                                   class="form-control rounded-3"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                                   placeholder="0901234567">
                            <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="invalid-feedback"></div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary py-2 rounded-3 fw-semibold">
                                <i class="fa-solid fa-floppy-disk me-1"></i> Lưu Thay Đổi
                            </button>
                            <a th:href="@{/profile/change-password}" class="btn btn-outline-warning text-dark py-2 rounded-3 fw-semibold">
                                <i class="fa-solid fa-key me-1"></i> Đổi Mật Khẩu
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
