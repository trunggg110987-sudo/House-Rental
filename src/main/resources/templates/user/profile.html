<!DOCTYPE html>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout('Thông tin cá nhân', ~{:: #profileContent})}">
<body>

<div id="profileContent" class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                             style="width: 70px; height: 70px;">
                            <i class="fa-solid fa-user-gear fa-2xl"></i>
                        </div>
                        <h4 class="fw-bold">Thông Tin Cá Nhân</h4>
                        <p class="text-muted small">Cập nhật thông tin profile của chính mình</p>
                    </div>
                    <hr class="my-4">

                    <div class="mt-3"
                         th:if="${user.hostStatus.name() == 'NONE' || user.hostStatus.name() == 'REJECTED'}">

                        <form th:action="@{/request-host}" method="post">

                            <button type="submit" class="btn btn-primary">

                                <i class="fa-solid fa-house"></i>

                                Đăng ký làm chủ nhà

                            </button>

                        </form>

                    </div>

                    <div class="alert alert-warning mt-3" th:if="${user.hostStatus.name() == 'PENDING'}">

                        <i class="fa-solid fa-clock me-2"></i>

                        Yêu cầu đăng ký chủ nhà đang chờ Admin duyệt.

                    </div>

                    <div class="alert alert-success mt-3" th:if="${user.hostStatus.name() == 'APPROVED'}">

                        <i class="fa-solid fa-circle-check me-2"></i>

                        Bạn đã được duyệt làm chủ nhà.

                    </div>

                    <form th:action="@{/profile}" th:object="${userProfile}" method="post" novalidate>
                        <!-- Tên đăng nhập (Readonly) -->
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Tên đăng nhập</label>
                            <input type="text" id="username" th:field="*{username}"
                                   class="form-control bg-light rounded-3" readonly>
                            <small class="text-muted">Tên đăng nhập không thể thay đổi.</small>
                        </div>

                        <!-- Họ và tên -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold">Họ và tên <span
                                    class="text-danger">*</span></label>
                            <input type="text" id="fullName" th:field="*{fullName}"
                                   class="form-control rounded-3"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                   placeholder="Nhập họ và tên...">
                            <div th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"
                                 class="invalid-feedback"></div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email <span
                                    class="text-danger">*</span></label>
                            <input type="email" id="email" th:field="*{email}"
                                   class="form-control rounded-3"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   placeholder="example@gmail.com">
                            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
                                 class="invalid-feedback"></div>
                        </div>

                        <!-- Số điện thoại -->
                        <div class="mb-4">
                            <label for="phone" class="form-label fw-semibold">Số điện thoại</label>
                            <input type="text" id="phone" th:field="*{phone}"
                                   class="form-control rounded-3"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                                   placeholder="0901234567">
                            <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"
                                 class="invalid-feedback"></div>
                        </div>

                        <!-- Nút Lưu & Đổi Mật Khẩu -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary py-2 rounded-3 fw-semibold">
                                <i class="fa-solid fa-floppy-disk me-1"></i> Lưu Thay Đổi
                            </button>
                            <a th:href="@{/profile/change-password}"
                               class="btn btn-outline-warning text-dark py-2 rounded-3 fw-semibold">
                                <i class="fa-solid fa-key me-1"></i> Đổi Mật Khẩu
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
