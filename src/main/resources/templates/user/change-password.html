<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: mainLayout('Thay đổi mật khẩu', ~{:: #changePasswordContent})}">
<body>

<div id="changePasswordContent" class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="bg-warning bg-opacity-10 text-warning rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                            <i class="fa-solid fa-key fa-2xl"></i>
                        </div>
                        <h4 class="fw-bold">Thay Đổi Mật Khẩu</h4>
                        <p class="text-muted small">Bảo mật tài khoản của bạn bằng mật khẩu mới</p>
                    </div>

                    <form th:action="@{/profile/change-password}" th:object="${changePassword}" method="post" novalidate>
                        <!-- Mật khẩu hiện tại -->
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label fw-semibold">Mật khẩu hiện tại <span class="text-danger">*</span></label>
                            <input type="password" id="currentPassword" th:field="*{currentPassword}" 
                                   class="form-control rounded-3" th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid' : ''" 
                                   placeholder="Nhập mật khẩu hiện tại...">
                            <div th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="invalid-feedback"></div>
                        </div>

                        <!-- Mật khẩu mới -->
                        <div class="mb-3">
                            <label for="newPassword" class="form-label fw-semibold">Mật khẩu mới <span class="text-danger">*</span></label>
                            <input type="password" id="newPassword" th:field="*{newPassword}" 
                                   class="form-control rounded-3" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''" 
                                   placeholder="Nhập mật khẩu mới...">
                            <div th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="invalid-feedback"></div>
                        </div>

                        <!-- Xác nhận mật khẩu mới -->
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu mới <span class="text-danger">*</span></label>
                            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" 
                                   class="form-control rounded-3" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''" 
                                   placeholder="Nhập lại mật khẩu mới...">
                            <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="invalid-feedback"></div>
                        </div>

                        <!-- Nút Lưu & Hủy -->
                        <div class="d-grid gap-2 mb-3">
                            <button type="submit" class="btn btn-warning text-dark py-2 rounded-3 fw-semibold">
                                <i class="fa-solid fa-lock me-1"></i> Đổi Mật Khẩu
                            </button>
                            <a th:href="@{/profile}" class="btn btn-outline-secondary py-2 rounded-3">
                                <i class="fa-solid fa-arrow-left me-1"></i> Quay lại trang cá nhân
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
