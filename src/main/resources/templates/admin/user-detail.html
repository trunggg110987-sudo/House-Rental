<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout(
      ~{'Chi tiết người dùng'},
      ~{::content})}">

<th:block th:fragment="content">

    <div class="container py-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h2 class="fw-bold">

                    <i class="fa-solid fa-user text-primary me-2"></i>

                    Chi tiết người dùng

                </h2>

                <p class="text-muted">

                    Thông tin tài khoản trong hệ thống

                </p>

            </div>

            <a th:href="@{/admin/users}"
               class="btn btn-secondary">

                <i class="fa-solid fa-arrow-left"></i>

                Quay lại

            </a>

        </div>

        <div class="card shadow border-0 rounded-4">

            <div class="card-body">

                <div class="row">

                    <div class="col-md-3 text-center">

                        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                             class="rounded-circle border"
                             width="180">

                    </div>

                    <div class="col-md-9">

                        <table class="table table-borderless">

                            <tr>

                                <th width="220">Username</th>

                                <td th:text="${dto.user.username}"></td>

                            </tr>

                            <tr>

                                <th>Họ và tên</th>

                                <td th:text="${dto.user.fullName}"></td>

                            </tr>

                            <tr>
                                <th>Email</th>
                                <td>
                                    <i class="fa-solid fa-envelope text-primary me-2"></i>
                                    <span th:text="${dto.user.email}"></span>
                                </td>
                            </tr>


                            <tr>

                                <th>Số điện thoại</th>

                                <td th:text="${dto.user.phone}"></td>

                            </tr>

                            <tr>

                                <th>Trạng thái</th>

                                <td>

                                <span class="badge bg-success"
                                      th:if="${dto.user.active}">

                                    Đang hoạt động

                                </span>

                                    <span class="badge bg-danger"
                                          th:unless="${dto.user.active}">

                                    Đã khóa

                                </span>

                                </td>

                            </tr>

                            <tr>

                                <th>Tổng tiền đã chi</th>

                                <td class="fw-bold text-success"
                                    th:text="${#numbers.formatDecimal(dto.totalSpent,0,'COMMA',0,'POINT')} + ' VNĐ'">

                                </td>

                            </tr>

                        </table>

                    </div>

                </div>

            </div>

        </div>

        <div class="card shadow border-0 rounded-4 mt-4">

            <div class="card-header bg-primary text-white">

                <i class="fa-solid fa-clock-rotate-left me-2"></i>

                Lịch sử thuê nhà

            </div>

            <div class="card-body">

                <table class="table table-hover align-middle">

                    <thead class="table-light">

                    <tr>

                        <th>STT</th>

                        <th>Nhà</th>

                        <th>Ngày nhận</th>

                        <th>Ngày trả</th>

                        <th>Số tiền</th>

                        <th>Trạng thái</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="booking,stat : ${dto.bookings}">

                        <td th:text="${stat.count}"></td>

                        <td>
                            <a th:href="@{/houses/{id}(id=${booking.house.id})}"
                               class="text-decoration-none fw-semibold text-primary">
                                <i class="fa-solid fa-house me-1"></i>
                                <span th:text="${booking.house.name}"></span>
                            </a>
                        </td>

                        <td th:text="${#temporals.format(booking.startDate, 'dd/MM/yyyy')}"></td>

                        <td th:text="${#temporals.format(booking.endDate, 'dd/MM/yyyy')}"></td>

                        <td class="text-success fw-bold"
                            th:text="${#numbers.formatDecimal(booking.totalPrice,0,'COMMA',0,'POINT')}+' VNĐ'">

                        </td>

                        <td>
                            <span class="badge"
                                  th:classappend="${booking.status.name() == 'APPROVED' ? 'bg-success' : (booking.status.name() == 'PENDING' ? 'bg-warning text-dark' : (booking.status.name() == 'CHECKED_IN' ? 'bg-primary' : (booking.status.name() == 'CHECKED_OUT' ? 'bg-info text-dark' : 'bg-danger')))}"
                                  th:text="${booking.getStatusVietnamese()}">
                            </span>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(dto.bookings)}">

                        <td colspan="6"
                            class="text-center text-muted">

                            Người dùng chưa có lịch sử thuê nhà.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</th:block>

</html>
