<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: mainLayout(
      ~{'Chi tiết chủ nhà'},
      ~{::content})}">

<th:block th:fragment="content">

  <div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

      <div>

        <h2 class="fw-bold">

          <i class="fa-solid fa-user-tie text-primary me-2"></i>

          Chi tiết chủ nhà

        </h2>

        <p class="text-muted">

          Thông tin chủ nhà trong hệ thống

        </p>

      </div>

      <a th:href="@{/admin/hosts}"

         class="btn btn-secondary">

        <i class="fa-solid fa-arrow-left"></i>

        Quay lại

      </a>

    </div>

    <div class="card shadow border-0 rounded-4">

      <div class="card-body">

        <div class="row">

          <div class="col-md-3 text-center">

            <img
                    src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
                    class="rounded-circle border"
                    width="180">

          </div>

          <div class="col-md-9">

            <table class="table table-borderless">

              <tr>

                <th width="220">

                  Username

                </th>

                <td th:text="${dto.host.username}"></td>

              </tr>

              <tr>

                <th>

                  Họ tên

                </th>

                <td th:text="${dto.host.fullName}"></td>

              </tr>

              <tr>

                <th>

                  Số điện thoại

                </th>

                <td th:text="${dto.host.phone}"></td>

              </tr>

              <tr>

                <th>

                  Địa chỉ

                </th>

                <td th:text="${dto.host.address}"></td>

              </tr>

              <tr>

                <th>

                  Trạng thái

                </th>

                <td>

                    <span
                            th:if="${dto.host.active}"
                            class="badge bg-success">

                            Đang hoạt động

                    </span>

                  <span
                          th:unless="${dto.host.active}"
                          class="badge bg-danger">

                            Đã khóa

                  </span>

                </td>

              </tr>

              <tr>

                <th>

                  Tổng doanh thu

                </th>

                <td class="text-success fw-bold"
                    th:text="${#numbers.formatDecimal(dto.revenue,0,'COMMA',0,'POINT')}+' VNĐ'">

                </td>

              </tr>

            </table>

          </div>

        </div>

      </div>

    </div>

    <div class="card shadow border-0 rounded-4 mt-4">

      <div class="card-header bg-primary text-white">

        <i class="fa-solid fa-house me-2"></i>

        Danh sách nhà đang cho thuê

      </div>

      <div class="card-body">

        <table class="table table-hover">

          <thead>

          <tr>

            <th>STT</th>

            <th>Tên nhà</th>

            <th>Địa chỉ</th>

            <th>Giá thuê (VNĐ / ngày)</th>

            <th>Trạng thái</th>

            <th>Chi tiết</th>

          </tr>

          </thead>

          <tbody>

          <tr th:each="house,stat : ${dto.houses}">

            <td th:text="${stat.count}"></td>

            <td th:text="${house.name}"></td>

            <td th:text="${house.address}"></td>

            <td class="fw-bold text-primary"
                    th:text="${#numbers.formatDecimal(house.getDisplayPricePerDay(),0,'COMMA',0,'POINT')}+' VNĐ / ngày'">
            </td>

            <td>
              <span class="badge"
                    th:classappend="${house.status != null and house.status.name() == 'AVAILABLE' ? 'bg-success' : (house.status != null and house.status.name() == 'MAINTENANCE' ? 'bg-warning text-dark' : 'bg-danger')}"
                    th:text="${house.getStatusVietnamese()}">
              </span>
            </td>

            <td>

              <a
                      th:href="@{/houses/{id}(id=${house.id})}"
                      class="btn btn-outline-primary btn-sm">

                Xem

              </a>

            </td>

          </tr>

          <tr th:if="${#lists.isEmpty(dto.houses)}">

            <td colspan="6"
                class="text-center text-muted">

              Chủ nhà chưa đăng nhà.

            </td>

          </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</th:block>

</html>
