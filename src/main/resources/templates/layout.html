<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="mainLayout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">House Rental - Cho Thuê Nhà</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8f9fa;
            color: #2b2d42;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.4rem;
            color: #0d6efd !important;
        }

        .house-card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            transition: transform .25s ease, box-shadow .25s ease;
            background: #fff;
        }

        .house-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0,0,0,.08);
        }

        .house-card-img {
            height: 220px;
            object-fit: cover;
            width: 100%;
        }

        .badge-status-AVAILABLE {
            background: #198754;
        }

        .badge-status-RENTED {
            background: #dc3545;
        }

        .badge-status-MAINTENANCE {
            background: #ffc107;
            color: #000;
        }

        .price-text {
            color: #0d6efd;
            font-weight: 700;
            font-size: 1.25rem;
        }

        .hero-banner {
            background: linear-gradient(135deg,#0d6efd 0%,#004085 100%);
            color: white;
            padding: 48px 0;
            border-radius: 0 0 24px 24px;
            margin-bottom: 32px;
        }

        .footer {
            background: white;
            border-top: 1px solid #e9ecef;
            padding: 24px 0;
            margin-top: 60px;
        }
    </style>

</head>

<body class="d-flex flex-column min-vh-100">

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">

    <div class="container">

        <a class="navbar-brand d-flex align-items-center gap-2"
           th:href="@{/}">
            <i class="fa-solid fa-house-chimney text-primary"></i>
            HouseRental
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link fw-semibold"
                       th:href="@{/}">
                        <i class="fa-solid fa-compass me-1"></i>
                        Khám Phá Nhà
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link fw-semibold"
                       th:href="@{/bookings/my-bookings}">
                        <i class="fa-solid fa-calendar-check me-1"></i>
                        Đơn Thuê Của Tôi
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link fw-semibold"
                       th:href="@{/bookings/host-requests}">
                        <i class="fa-solid fa-user-shield me-1"></i>
                        Duyệt Đặt Nhà
                    </a>
                </li>

            </ul>

            <div class="d-flex align-items-center gap-2">

                <!-- Anonymous -->

                <div sec:authorize="isAnonymous()">

                    <a th:href="@{/login}"
                       class="btn btn-primary rounded-pill px-3">

                        <i class="fa-solid fa-right-to-bracket me-1"></i>

                        Đăng nhập

                    </a>

                </div>

                <!-- Authenticated -->

                <div sec:authorize="isAuthenticated()"
                     class="dropdown">

                    <button class="btn btn-outline-primary dropdown-toggle rounded-pill"
                            data-bs-toggle="dropdown">

                        <i class="fa-solid fa-user me-1"></i>

                        Xin chào,

                        <strong sec:authentication="name"></strong>

                    </button>

                    <ul class="dropdown-menu dropdown-menu-end">

                        <li>

                            <span class="dropdown-item-text">

                                Đã đăng nhập

                            </span>

                        </li>

                        <li><hr class="dropdown-divider"></li>

                        <li>

                            <form th:action="@{/logout}"
                                  method="post">

                                <button type="submit"
                                        class="dropdown-item text-danger">

                                    <i class="fa-solid fa-right-from-bracket me-2"></i>

                                    Đăng xuất

                                </button>

                            </form>

                        </li>

                    </ul>

                </div>

                <a sec:authorize="isAuthenticated()"
                   th:href="@{/houses/create}"
                   class="btn btn-outline-primary rounded-pill px-3">

                    <i class="fa-solid fa-plus me-1"></i>

                    Đăng Tin Cho Thuê

                </a>

            </div>

        </div>

    </div>

</nav>

<!-- ================= ALERT ================= -->

<div class="container mt-3"
     th:if="${successMessage}">

    <div class="alert alert-success alert-dismissible fade show rounded-3">

        <i class="fa-solid fa-circle-check me-2"></i>

        <span th:text="${successMessage}"></span>

        <button class="btn-close"
                data-bs-dismiss="alert"></button>

    </div>

</div>

<div class="container mt-3"
     th:if="${errorMessage}">

    <div class="alert alert-danger alert-dismissible fade show rounded-3">

        <i class="fa-solid fa-triangle-exclamation me-2"></i>

        <span th:text="${errorMessage}"></span>

        <button class="btn-close"
                data-bs-dismiss="alert"></button>

    </div>

</div>

<div class="container mt-3"
     th:if="${infoMessage}">

    <div class="alert alert-info alert-dismissible fade show rounded-3">

        <i class="fa-solid fa-circle-info me-2"></i>

        <span th:text="${infoMessage}"></span>

        <button class="btn-close"
                data-bs-dismiss="alert"></button>

    </div>

</div>

<!-- Logout Success -->

<div class="container mt-3"
     th:if="${param.logout}">

    <div class="alert alert-success alert-dismissible fade show rounded-3">

        <i class="fa-solid fa-circle-check me-2"></i>

        Đăng xuất thành công.

        <button class="btn-close"
                data-bs-dismiss="alert"></button>

    </div>

</div>

<!-- ================= CONTENT ================= -->

<main class="flex-grow-1">

    <div th:replace="${content}"></div>

</main>

<!-- ================= FOOTER ================= -->

<footer class="footer text-center text-muted">

    <div class="container">

        <p class="mb-1 fw-semibold">

            © 2026 HouseRental System. Tất cả quyền được bảo lưu.

        </p>

        <small>

            Phát triển trên nền tảng Spring Boot 3, JPA, Thymeleaf & Bootstrap 5

        </small>

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
