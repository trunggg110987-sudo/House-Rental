<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="mainLayout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">House Rental - Cho Thuê Nhà</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8f9fa;
            color: #2b2d42;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.4rem;
            color: #0d6efd !important;
        }
        .house-card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            background: #ffffff;
        }
        .house-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.08);
        }
        .house-card-img {
            height: 220px;
            object-fit: cover;
            width: 100%;
        }
        .badge-status-AVAILABLE {
            background-color: #198754;
        }
        .badge-status-RENTED {
            background-color: #dc3545;
        }
        .badge-status-MAINTENANCE {
            background-color: #ffc107;
            color: #000;
        }
        .price-text {
            color: #0d6efd;
            font-weight: 700;
            font-size: 1.25rem;
        }
        .hero-banner {
            background: linear-gradient(135deg, #0d6efd 0%, #004085 100%);
            color: white;
            padding: 48px 0;
            border-radius: 0 0 24px 24px;
            margin-bottom: 32px;
        }
        .footer {
            background-color: #ffffff;
            border-top: 1px solid #e9ecef;
            padding: 24px 0;
            margin-top: 60px;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <i class="fa-solid fa-house-chimney text-primary"></i> HouseRental
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" th:href="@{/}">
                            <i class="fa-solid fa-compass me-1"></i> Khám Phá Nhà
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link fw-semibold" th:href="@{/bookings/my-bookings}">
                            <i class="fa-solid fa-calendar-check me-1"></i> Đơn Thuê Của Tôi
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link fw-semibold" th:href="@{/bookings/host-requests}">
                            <i class="fa-solid fa-user-shield me-1"></i> Duyệt Đặt Nhà (Chủ Nhà)
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a th:href="@{/houses/create}" class="btn btn-outline-primary btn-sm rounded-pill px-3">
                        <i class="fa-solid fa-plus me-1"></i> Đăng Tin Cho Thuê
                    </a>

                    <!-- Guest Mode (Not Logged In) -->
                    <div sec:authorize="!isAuthenticated()">
                        <a th:href="@{/login}" class="btn btn-primary btn-sm rounded-pill px-3 fw-semibold">
                            <i class="fa-solid fa-right-to-bracket me-1"></i> Đăng Nhập
                        </a>
                    </div>

                    <!-- Authenticated User Menu -->
                    <div sec:authorize="isAuthenticated()" class="dropdown">
                        <button class="btn btn-light btn-sm rounded-pill dropdown-toggle d-flex align-items-center gap-2 border px-3" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fa-solid fa-circle-user text-primary fs-5"></i>
                            <span sec:authentication="name" class="fw-semibold small">Tài khoản</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3 mt-2">
                            <li><a class="dropdown-item py-2" th:href="@{/bookings/my-bookings}"><i class="fa-solid fa-list me-2 text-primary"></i> Đơn thuê của tôi</a></li>
                            <li><a class="dropdown-item py-2" th:href="@{/houses/my-houses}"><i class="fa-solid fa-house me-2 text-primary"></i> Nhà của tôi</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item text-danger py-2 fw-semibold"><i class="fa-solid fa-right-from-bracket me-2"></i> Đăng xuất</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Alert Messages -->
    <div class="container mt-3" th:if="${successMessage}">
        <div class="alert alert-success alert-dismissible fade show rounded-3" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i> <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>
    <div class="container mt-3" th:if="${errorMessage}">
        <div class="alert alert-danger alert-dismissible fade show rounded-3" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-2"></i> <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>
    <div class="container mt-3" th:if="${infoMessage}">
        <div class="alert alert-info alert-dismissible fade show rounded-3" role="alert">
            <i class="fa-solid fa-circle-info me-2"></i> <span th:text="${infoMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>

    <!-- Main Dynamic Content -->
    <main class="flex-grow-1">
        <div th:replace="${content}"></div>
    </main>

    <!-- Footer -->
    <footer class="footer text-center text-muted">
        <div class="container">
            <p class="mb-1 fw-semibold">© 2026 HouseRental System. Tất cả quyền được bảo lưu.</p>
            <small>Phát triển trên nền tảng Spring Boot 4, JPA & Thymeleaf + Bootstrap 5</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
